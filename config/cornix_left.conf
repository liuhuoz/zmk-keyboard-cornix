# Keyboard name
CONFIG_ZMK_KEYBOARD_NAME="Cornix"

# Bluetooth configuration
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_CENTRAL=y
# Increased for multiple PC profiles: 3 PC profiles + right keyboard + trackball = 5
CONFIG_BT_MAX_CONN=5
CONFIG_BT_MAX_PAIRED=5

# Split keyboard configuration
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_BLE=y
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y
#CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2

# Increase BLE TX power for better connectivity (from original Cornix)
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Battery level reporting
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y


# Mouse support
#CONFIG_ZMK_MOUSE=y

# Power management
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_TIMEOUT=30000
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

# Enable USB logging (for debugging)
# Temporarily disabled for Bluetooth pairing troubleshooting
# CONFIG_ZMK_USB_LOGGING=y

# Battery reporting
CONFIG_ZMK_BATTERY_REPORTING=y


# ===== PROSPECTOR SCANNER MODULE CONFIGURATION =====
# ===== REQUIRED =====
CONFIG_ZMK_STATUS_ADVERTISEMENT=y
CONFIG_ZMK_STATUS_ADV_KEYBOARD_NAME="Cornix"  # Shown on scanner (max 8 chars)

# ===== POWER OPTIMIZATION (all have sensible defaults) =====
# CONFIG_ZMK_STATUS_ADV_ACTIVITY_BASED=y          # Default: y (enabled)
# CONFIG_ZMK_STATUS_ADV_ACTIVE_INTERVAL_MS=200    # Default: 200 (5Hz when typing)
# CONFIG_ZMK_STATUS_ADV_IDLE_INTERVAL_MS=30000    # Default: 30000 (0.03Hz when idle)
# CONFIG_ZMK_STATUS_ADV_ACTIVITY_TIMEOUT_MS=10000 # Default: 10000 (10s before idle)

# ===== SPLIT KEYBOARD =====
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y  # Fetch peripheral battery
CONFIG_ZMK_STATUS_ADV_CENTRAL_SIDE="LEFT"        # Which side is central (LEFT/RIGHT)

# ===== PERIPHERAL BATTERY MAPPING (v2.1, for multi-peripheral setups) =====
# Use when connection order doesn't match physical layout (e.g., after settings_reset)
# CONFIG_ZMK_STATUS_ADV_HALF_PERIPHERAL=0         # Keyboard half slot (default: 0)
# CONFIG_ZMK_STATUS_ADV_AUX1_PERIPHERAL=1         # Aux1 slot - e.g., trackball (default: 1)
# CONFIG_ZMK_STATUS_ADV_AUX2_PERIPHERAL=2         # Aux2 slot - e.g., numpad (default: 2)

# ===== WPM TRACKING =====
# CONFIG_ZMK_STATUS_ADV_WPM_WINDOW_SECONDS=30       # WPM calculation window (5-120s)

# ===== CHANNEL (v1.1.2+, optional) =====
# For multi-keyboard environments - filter by channel on scanner side
# CONFIG_PROSPECTOR_CHANNEL=0                     # 0=broadcast to all (default)
# CONFIG_PROSPECTOR_CHANNEL=1                     # 1-9=recommended (touch UI compatible)

# ===== RGB LED WIDGET CONFIGURATION =====
CONFIG_RGBLED_WIDGET=y
CONFIG_RGBLED_WIDGET_WS2812=y
CONFIG_RGBLED_WIDGET_CONN_COLOR_BT1=6

# ===== DYA STUDIO CUSTOM SETTING =====
CONFIG_SETTINGS=y
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_TRANSPORT_BLE=y

# 共享 RPC 缓冲（保留 10 模块取最大）
CONFIG_ZMK_STUDIO_RPC_RX_BUF_SIZE=192
CONFIG_ZMK_STUDIO_RPC_CUSTOM_SUBSYSTEM_REQUEST_PAYLOAD_MAX_BYTES=192
CONFIG_ZMK_LOW_PRIORITY_THREAD_STACK_SIZE=2048
CONFIG_ZMK_CUSTOM_SETTINGS_LARGE_VALUE_MAX_SIZE=256

# ★分体 relay 必须开（否则 battery-history 宏未定义→编译失败）
CONFIG_ZMK_SPLIT_RELAY_EVENT=y
CONFIG_ZMK_SPLIT_RELAY_EVENT_DATA_LEN=240

# ble-management
CONFIG_ZMK_BLE_MANAGEMENT=y
CONFIG_ZMK_BLE_MANAGEMENT_STUDIO_RPC=y

# battery-history
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_BATTERY_HISTORY=y
CONFIG_ZMK_BATTERY_HISTORY_STUDIO_RPC=y

# settings-rpc
CONFIG_ZMK_SETTINGS_RPC=y
CONFIG_ZMK_SETTINGS_RPC_STUDIO=y

# runtime-input-processor（自动带出 custom-settings）
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_RUNTIME_INPUT_PROCESSOR=y
CONFIG_ZMK_RUNTIME_INPUT_PROCESSOR_STUDIO_RPC=y

# sensor-rotate（encoder 调参）
CONFIG_ZMK_RUNTIME_SENSOR_ROTATE=y
CONFIG_ZMK_RUNTIME_SENSOR_ROTATE_STUDIO_RPC=y

# custom-settings（地基）
CONFIG_ZMK_CUSTOM_SETTINGS=y
CONFIG_ZMK_CUSTOM_SETTINGS_STUDIO_RPC=y
CONFIG_ZMK_CUSTOM_SETTINGS_SPLIT_RPC_RELAY=y

# runtime-combo
CONFIG_ZMK_RUNTIME_COMBO=y
CONFIG_ZMK_RUNTIME_COMBO_STUDIO_RPC=y

# runtime-macro
CONFIG_ZMK_RUNTIME_MACRO=y
CONFIG_ZMK_BEHAVIOR_LOCAL_ID_TYPE_CRC16=y
CONFIG_ZMK_RUNTIME_MACRO_STUDIO_RPC=y

# os-detection
CONFIG_ZMK_OS_DETECTION=y
CONFIG_ZMK_OS_DETECTION_USB=y
CONFIG_ZMK_OS_DETECTION_BLE=y
CONFIG_ZMK_OS_DETECTION_STUDIO_RPC=y

# default-layer
CONFIG_ZMK_DEFAULT_LAYER=y
CONFIG_ZMK_DEFAULT_LAYER_MIN_INDEX=0
CONFIG_ZMK_DEFAULT_LAYER_MAX_INDEX=4
CONFIG_ZMK_DEFAULT_LAYER_STUDIO_RPC=y
CONFIG_ZMK_DEFAULT_LAYER_OS_DETECTION=y

# device-info（提供 troubleshooting 电量/诊断数据）
CONFIG_ZMK_DEVICE_INFO=y
CONFIG_ZMK_DEVICE_INFO_STUDIO_RPC=y