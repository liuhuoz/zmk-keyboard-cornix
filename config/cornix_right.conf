# Cornix Right (Peripheral) Configuration

# Bluetooth configuration
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y

# Split keyboard configuration (peripheral role - no CENTRAL flag)
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_BLE=y

# Disable USB on peripheral (only BLE)
CONFIG_ZMK_USB=n

# Power management
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_TIMEOUT=30000
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

# Battery reporting
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60

# ===== DYA STUDIO CUSTOM SETTING =====
CONFIG_SETTINGS=y

# ★分体 relay 同右侧必须开
CONFIG_ZMK_SPLIT_RELAY_EVENT=y
CONFIG_ZMK_SPLIT_RELAY_EVENT_DATA_LEN=240

# settings-rpc（副手也要）
CONFIG_ZMK_SETTINGS_RPC=y

# custom-settings（地基 + 分体 relay）
CONFIG_ZMK_CUSTOM_SETTINGS=y
CONFIG_ZMK_CUSTOM_SETTINGS_SPLIT_RPC_RELAY=y

# battery-history（副手采集电池）
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_BATTERY_HISTORY=y

# sensor-rotate（若 encoder 在副手）
CONFIG_ZMK_RUNTIME_SENSOR_ROTATE=y

# 性能/省资源（副手不连电脑）
CONFIG_ZMK_LOW_PRIORITY_THREAD_STACK_SIZE=2048
CONFIG_CONSOLE=n
CONFIG_BOARD_SERIAL_BACKEND_CDC_ACM=n

